# One released version of FoodChainIQ (e.g. tag v0.1.0), served at
# https://<domain>/<slug>/ next to the latest build from main.
#
# Used by deploy/release.sh, which sets:
#   RELEASE_SRC    checkout of the tag (a git worktree)
#   RELEASE_TOOLS  this folder
#   RELEASE_TAG    e.g. v0.1.0          (image tags)
#   BASE_PATH      e.g. /v010/          (where the app is served)
#   APP_PORT       e.g. 127.0.0.1:9010  (only reachable through Caddy)
# and runs it as its own compose project (foodchainiq-v010), so each release
# has its own containers, database and uploaded files.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodchainiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the release env file}
      POSTGRES_DB: ${POSTGRES_DB:-foodchainiq}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ${RELEASE_SRC:?}/backend
    image: foodchainiq-backend:${RELEASE_TAG:?}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-foodchainiq}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-foodchainiq}
      STORAGE_DIR: /data/storage
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the release env file}
      ACCESS_TOKEN_TTL_S: ${ACCESS_TOKEN_TTL_S:-900}
      REFRESH_TOKEN_TTL_S: ${REFRESH_TOKEN_TTL_S:-604800}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-strict}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in the release env file}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in the release env file}
      SEED_DEMO: ${SEED_DEMO:-false}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-approval}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      DEFAULT_QUOTA_BYTES: ${DEFAULT_QUOTA_BYTES:-10737418240}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - storage:/data
    expose:
      - "8000"

  web:
    build:
      context: ${RELEASE_SRC:?}/frontend
      dockerfile: ${RELEASE_TOOLS:?}/web.Dockerfile
      args:
        BASE_PATH: ${BASE_PATH:?}
        VITE_SHOW_DEMO_ACCOUNTS: ${SHOW_DEMO_ACCOUNTS:-false}
    image: foodchainiq-web:${RELEASE_TAG:?}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:?}:80"

volumes:
  db-data:
  storage:
