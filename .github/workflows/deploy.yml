# CI/CD: test every push and pull request; deploy pushes to `main` to the
# DigitalOcean droplet over SSH (git pull + docker compose up --build).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DROPLET_HOST     droplet IP or hostname
#   DROPLET_USER     SSH user on the droplet (e.g. `deploy`)
#   DROPLET_SSH_KEY  private key whose public half is in that user's authorized_keys
# Optional repository variable:
#   APP_DIR          checkout path on the droplet (default: ~/VK-simulator)
#
# Setup guide: documentation/deployment-digitalocean.md

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: foodchainiq
          POSTGRES_PASSWORD: foodchainiq
          POSTGRES_DB: foodchainiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foodchainiq -d foodchainiq_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://foodchainiq:foodchainiq@localhost:5432/foodchainiq_test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy:
    needs: [backend-tests, frontend-build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ vars.APP_DIR }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: APP_DIR,SHA
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${APP_DIR:-$HOME/VK-simulator}"
            git fetch --prune origin main
            git checkout --force "$SHA"
            docker compose up -d --build --remove-orphans
            docker image prune -f
            # Wait for the app to answer through nginx.
            PORT=$(grep -E '^APP_PORT=' .env 2>/dev/null | cut -d= -f2 || true)
            PORT=${PORT##*:}   # allow APP_PORT=127.0.0.1:8080
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${PORT:-8080}/api/health" >/dev/null; then
                echo "Deployed $SHA"; exit 0
              fi
              sleep 5
            done
            echo "Health check failed"; docker compose ps; docker compose logs --tail=100 backend web
            exit 1
