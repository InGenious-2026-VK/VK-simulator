# CI/CD: test every push and pull request, then deploy over SSH to the
# DigitalOcean droplet:
#
#   push to main            → latest version at https://<domain>/
#   push a tag v1.2.3       → that release at  https://<domain>/v123/
#   Run workflow (manual)   → latest from main, or the release named in
#                             "release_tag" (use this for tags that existed
#                             before this workflow could deploy releases)
#
# Releases run beside the latest version, each with its own database; see
# deploy/release.sh and documentation/deployment-digitalocean.md.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DROPLET_HOST     droplet IP or hostname
#   DROPLET_USER     SSH user on the droplet (e.g. `deploy`)
#   DROPLET_SSH_KEY  private key whose public half is in that user's authorized_keys
# Optional repository variable:
#   APP_DIR          checkout path on the droplet (default: ~/VK-simulator)
#
# Setup guide: documentation/deployment-digitalocean.md

name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Deploy this release tag (e.g. v0.1.0) instead of main
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: foodchainiq
          POSTGRES_PASSWORD: foodchainiq
          POSTGRES_DB: foodchainiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foodchainiq -d foodchainiq_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://foodchainiq:foodchainiq@localhost:5432/foodchainiq_test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy:
    needs: [backend-tests, frontend-build]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag == ''))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ vars.APP_DIR }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: APP_DIR,SHA
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${APP_DIR:-$HOME/VK-simulator}"
            git fetch --prune origin main
            git checkout --force "$SHA"
            docker compose up -d --build --remove-orphans
            docker image prune -f
            # Wait for the app to answer through nginx.
            PORT=$(grep -E '^APP_PORT=' .env 2>/dev/null | cut -d= -f2 || true)
            PORT=${PORT##*:}   # allow APP_PORT=127.0.0.1:8080
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${PORT:-8080}/api/health" >/dev/null; then
                echo "Deployed $SHA"; exit 0
              fi
              sleep 5
            done
            echo "Health check failed"; docker compose ps; docker compose logs --tail=100 backend web
            exit 1

  deploy-release:
    needs: [backend-tests, frontend-build]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-release-${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' is not a release tag like v1.2.3"; exit 1; }
          SLUG="v${TAG#v}"; echo "Deploying $TAG to /${SLUG//./}/"
      - name: Deploy release to droplet
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ vars.APP_DIR }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: APP_DIR,TAG
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${APP_DIR:-$HOME/VK-simulator}"
            if [ ! -x deploy/release.sh ]; then
              echo "deploy/release.sh is missing on the droplet: deploy main first (it ships the release tooling)."
              exit 1
            fi
            deploy/release.sh "$TAG"
