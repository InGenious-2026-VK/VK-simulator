# FoodChainIQ — full deployment: PostgreSQL + backend API + web frontend.
#
#   cp .env.example .env      # then set the secrets in .env
#   docker compose up -d --build
#   open http://localhost:8080
#
# Services
#   db        PostgreSQL 16 (data in the `db-data` volume)
#   backend   FastAPI API (uploaded dataset files in the `storage` volume)
#   web       nginx serving the built React app and proxying /api → backend
#
# Only `web` is published to the network (APP_PORT, default 8080). The database
# is also published on 127.0.0.1:5432 so the local dev launchers (run.sh /
# run.bat, which run `docker compose up -d db`) can use it; set DB_PORT to move
# it. Put a TLS-terminating proxy in front of `web` for internet-facing use and
# set COOKIE_SECURE=true.

name: foodchainiq

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodchainiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodchainiq}
      POSTGRES_DB: ${POSTGRES_DB:-foodchainiq}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    image: foodchainiq-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-foodchainiq}:${POSTGRES_PASSWORD:-foodchainiq}@db:5432/${POSTGRES_DB:-foodchainiq}
      STORAGE_DIR: /data/storage
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-in-production-0123456789}
      ACCESS_TOKEN_TTL_S: ${ACCESS_TOKEN_TTL_S:-900}
      REFRESH_TOKEN_TTL_S: ${REFRESH_TOKEN_TTL_S:-604800}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-strict}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@foodchainiq.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      SEED_DEMO: ${SEED_DEMO:-true}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-approval}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648}
      DEFAULT_QUOTA_BYTES: ${DEFAULT_QUOTA_BYTES:-10737418240}
      # The browser talks to `web` (same origin), so CORS is only needed for
      # other frontends.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${APP_PORT:-8080}}
    volumes:
      - storage:/data
    expose:
      - "8000"

  web:
    build:
      context: ./frontend
      args:
        VITE_SHOW_DEMO_ACCOUNTS: ${SHOW_DEMO_ACCOUNTS:-false}
    image: foodchainiq-web:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  db-data:
  storage:
