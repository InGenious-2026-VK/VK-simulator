# FoodChainIQ web server: static SPA + reverse proxy to the API.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Dataset uploads (backend limit MAX_UPLOAD_BYTES, default 2 GB).
    client_max_body_size 2g;

    # API → backend container. Uploads are streamed, not buffered to disk.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/datalake, /visualize, /simulate) → index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;
    gzip_min_length 1024;
}
